# ===================================================================
# Traefik v3 Helm Values — LoadBalancer + Auto TLS (cert-manager)
# Namespace: kube-system
# Domain: traefik.k8s.io
# ===================================================================

# -------------------------------
# 🌐 Ports
# -------------------------------
ports:
  # HTTP entryPoint (redirects to HTTPS)
  web:
    port: 80
    # nodePort not needed for LoadBalancer — omitted
    expose: 
      default: true

  # HTTPS entryPoint
  websecure:
    port: 443
    # nodePort not needed — omitted
    expose: 
      default: true

  # 🔑 MUST ADD: Traefik internal API port (required by Helm templates)
  # - Used by Dashboard, API, and cert-manager HTTP-01 challenge
  # - expose: false → only listens inside Pod, NOT exposed via Service
  traefik:
    port: 8000
    protocol: TCP
    expose: 
      default: false  # ✅ Critical: no external port, secure!

# -------------------------------
# 🖥️ API & Dashboard
# -------------------------------
api:
  dashboard: true
  insecure: false  # enforce HTTPS

# Disable auto-created Ingress for dashboard (we'll define our own)
experimental:
  kubernetes:
    ingress:
      dashboard:
        enabled: false

# -------------------------------
# 🚪 Providers (Gateway API + Ingress for cert-manager)
# -------------------------------
providers:
  # ✅ Enabled for cert-manager HTTP-01 challenge
  kubernetesIngress:
    enabled: true

  # Disable Gateway API as we're using Ingress + cert-manager
  kubernetesGateway:
    enabled: false

# -------------------------------
# 🌉 Gateway (disabled)
# -------------------------------
gateway:
  enabled: false

# -------------------------------
# 🌐 Service: LoadBalancer
# -------------------------------
service:
  type: LoadBalancer
  # Optional: cloud annotations (uncomment as needed)
  # annotations:
  #   # AWS NLB
  #   service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
  #   # GCP Internal LB
  #   networking.gke.io/load-balancer-type: "Internal"

# -------------------------------
# 🔐 Security: Dashboard Auth
# -------------------------------
extraObjects:
  # 1. BasicAuth Secret
  - apiVersion: v1
    kind: Secret
    metadata:
      name: dashboard-auth-secret
      namespace: kube-system
    type: kubernetes.io/basic-auth
    stringData:
      username: admin
      password: "P@ssw0rd"  # 🔐 Change in production!

  # 2. Traefik Middleware
  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: dashboard-auth
      namespace: kube-system
    spec:
      basicAuth:
        secret: dashboard-auth-secret

  # 3. Dashboard Service (ClusterIP to port 9000)
  - apiVersion: v1
    kind: Service
    metadata:
      name: traefik-dashboard
      namespace: kube-system
    spec:
      type: ClusterIP
      selector:
        app.kubernetes.io/name: traefik
      ports:
        - port: 9000
          targetPort: 9000
          name: dashboard

  # 4. Ingress for Dashboard + Auto TLS (cert-manager)
  - apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: traefik-dashboard
      namespace: kube-system
      annotations:
        # 🔑 cert-manager auto-issue
        cert-manager.io/cluster-issuer: "letsencrypt-prod"
        # Apply Traefik Middleware (BasicAuth)
        traefik.ingress.kubernetes.io/router.middlewares: "kube-system-dashboard-auth@kubernetescrd"
    spec:
      ingressClassName: traefik  # ← Must match Traefik's class
      tls:
        - hosts:
            - traefik.k8s.io    # ✅ Your domain
          secretName: traefik-dashboard-tls  # auto-created by cert-manager
      rules:
        - host: traefik.k8s.io
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: traefik-dashboard
                    port:
                      number: 9000

# -------------------------------
# 📊 Observability
# -------------------------------
logs:
  general:
    level: INFO
  access:
    enabled: true

metrics:
  prometheus:
    enabled: true
    entryPoint: metrics  # optional: expose on port 9000/metrics

# -------------------------------
# 🧱 Resources (optional tuning)
# -------------------------------
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi