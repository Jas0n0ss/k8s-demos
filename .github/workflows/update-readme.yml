name: Update README Navigation

on:
  push:
    branches:
      - main  # 根据你的默认分支调整，例如 master
    # paths:  # 监听所有文件，包括 README.md
    #   - '**'
    #   - '!README.md'  # 移除此行，允许 README.md 变更也触发
    #   - '!.github/workflows/update-readme.yml'

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # 使用 GITHUB_TOKEN 进行推送

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate new navigation and update README
        run: |
          # 定义一个 Python 脚本，用于生成目录导航并更新 README
          python << 'EOF'
          import os
          from urllib.parse import quote

          def generate_toc(directory='.', max_depth=3, current_depth=0):
              toc = []
              if current_depth >= max_depth:
                  return toc
              
              items = sorted(os.listdir(directory))
              for item in items:
                  if item.startswith('.') or item == 'README.md':
                      continue
                  path = os.path.join(directory, item)
                  relative_path = os.path.relpath(path, '.')
                  # 生成锚点链接，转换为小写，空格和特殊字符转为连字符
                  anchor = quote(relative_path.lower().replace(' ', '-').replace('_', '-').replace('/', '-'))
                  
                  indent = '  ' * current_depth
                  if os.path.isdir(path):
                      toc.append(f"{indent}- [{item}](#{anchor})")
                      toc.extend(generate_toc(path, max_depth, current_depth + 1))
                  else:
                      # 对于文件，不递归，但添加到当前层级
                      if current_depth > 0: # 只在子目录中添加文件
                          toc.append(f"{indent}- [{item}](#{anchor})")
              return toc

          # 生成新的导航内容
          new_toc_lines = generate_toc()
          new_toc_content = '\n'.join(new_toc_lines)

          # 读取原始 README 内容
          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read()

          # 使用更宽松的匹配方式查找导航部分的开始和结束位置
          # 查找包含 "目录导航" 的行
          lines = content.splitlines()
          nav_start_index = -1
          nav_end_index = -1

          for i, line in enumerate(lines):
              if line.strip() == '## 目录导航':  # 精确匹配标题
                  nav_start_index = i
                  break

          if nav_start_index == -1:
              print("Error: Could not find the start marker '## 目录导航' in README.md")
              exit(1)

          # 从导航开始的下一行开始查找结束标记
          for i in range(nav_start_index + 1, len(lines)):
              line = lines[i]
              if line.startswith('---'):  # 找到分隔线
                  nav_end_index = i
                  break

          if nav_end_index == -1:
              print("Error: Could not find the end marker '---' after the navigation start in README.md")
              exit(1)

          # 重组内容：开始部分 + 新导航 + 之后的内容
          # 保留开始部分到导航开始（包括标题）
          before_nav = lines[:nav_start_index + 1]  # +1 to include the '## 目录导航' line
          # 保留导航结束之后的内容（包括分隔线）
          after_nav = lines[nav_end_index:]
          
          # 组合新内容
          updated_lines = before_nav + [''] + new_toc_lines + [''] + after_nav
          updated_content = '\n'.join(updated_lines)

          # 写回 README.md
          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(updated_content)
          
          print("README.md navigation updated successfully.")
          EOF

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 检查是否有更改
          if git diff --quiet README.md; then
            echo "No changes to README.md detected after script run. Nothing to commit."
          else
            git add README.md
            # 检查是否已经暂存了更改
            if git diff --cached --quiet README.md; then
              echo "No meaningful changes to commit after script run."
            else
              # 使用 [skip ci] 标记，这样本次提交不会触发新的 workflow 运行
              git commit -m "docs: auto-update README navigation [skip ci]"
              git push
              echo "README.md updated and pushed with [skip ci] flag."
            fi
          fi
