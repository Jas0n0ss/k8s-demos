name: Update README Navigation

on:
  push:
    branches:
      - main  # 根据你的默认分支调整，例如 master
    paths:
      - '**'  # 监听所有文件的更改，确保目录结构变化能触发
      - '!README.md'  # 排除 README.md 自身，避免无限循环
      - '!.github/workflows/update-readme.yml' # 排除自身，避免无限循环

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # 使用 GITHUB_TOKEN 进行推送

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate new navigation and update README
        run: |
          # 定义一个 Python 脚本，用于生成目录导航并更新 README
          python << 'EOF'
          import os
          import re
          from urllib.parse import quote

          def generate_toc(directory='.', max_depth=3, current_depth=0):
              toc = []
              if current_depth >= max_depth:
                  return toc
              
              items = sorted(os.listdir(directory))
              for item in items:
                  if item.startswith('.') or item == 'README.md':
                      continue
                  path = os.path.join(directory, item)
                  relative_path = os.path.relpath(path, '.')
                  # 生成锚点链接，转换为小写，空格和特殊字符转为连字符
                  anchor = quote(relative_path.lower().replace(' ', '-').replace('_', '-').replace('/', '-'))
                  
                  indent = '  ' * current_depth
                  if os.path.isdir(path):
                      toc.append(f"{indent}- [{item}](#{anchor})")
                      toc.extend(generate_toc(path, max_depth, current_depth + 1))
                  else:
                      # 对于文件，不递归，但添加到当前层级
                      if current_depth > 0: # 只在子目录中添加文件
                          toc.append(f"{indent}- [{item}](#{anchor})")
              return toc

          # 生成新的导航内容
          new_toc_lines = generate_toc()
          new_toc_content = '\n'.join(new_toc_lines)

          # 读取原始 README 内容
          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read()

          # 使用正则表达式查找并替换导航部分
          # 匹配从 "## 📂 目录导航" 开始，到下一个 "## " 或文件结尾的内容
          # re.DOTALL 使得 . 可以匹配换行符
          pattern = r'(## 📂 目录导航\n\n).*?(\n---\n)'
          match = re.search(pattern, content, re.DOTALL)

          if not match:
              print("Error: Could not find the navigation section in README.md")
              print("Expected format: '## 📂 目录导航\\n\\n' followed by content and '\\n---\\n'")
              exit(1)
          
          # 替换匹配到的部分
          before_match = content[:match.start(1)] # "## 📂 目录导航" 之前的部分
          after_match = content[match.end(2):]    # "---" 之后的部分
          
          # 重组内容
          updated_content = before_match + "## 📂 目录导航\n\n" + new_toc_content + "\n" + after_match

          # 写回 README.md
          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(updated_content)
          
          print("README.md navigation updated successfully.")
          EOF

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          if git diff --staged --quiet README.md; then
            echo "No changes to commit."
          else
            git commit -m "docs: auto-update README navigation [skip ci]"
            git push
            echo "README.md updated and pushed."
          fi
