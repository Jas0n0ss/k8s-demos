name: Update README Navigation

on:
  push:
    branches:
      - main  # 根据你的默认分支调整，例如 master
    paths:
      - '**'  # 监听所有文件的更改，确保目录结构变化能触发
      - '!README.md'  # 排除 README.md 自身，避免无限循环
      - '!.github/workflows/update-readme.yml' # 排除自身，避免无限循环

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # 使用 GITHUB_TOKEN 进行推送

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate new navigation and update README
        run: |
          # 定义一个 Python 脚本，用于生成目录导航并更新 README
          python << 'EOF'
          import os
          from urllib.parse import quote

          def generate_toc(directory='.', max_depth=3, current_depth=0):
              toc = []
              if current_depth >= max_depth:
                  return toc
              
              items = sorted(os.listdir(directory))
              for item in items:
                  if item.startswith('.') or item == 'README.md':
                      continue
                  path = os.path.join(directory, item)
                  relative_path = os.path.relpath(path, '.')
                  # 生成锚点链接，转换为小写，空格和特殊字符转为连字符
                  anchor = quote(relative_path.lower().replace(' ', '-').replace('_', '-').replace('/', '-'))
                  
                  indent = '  ' * current_depth
                  if os.path.isdir(path):
                      toc.append(f"{indent}- [{item}](#{anchor})")
                      toc.extend(generate_toc(path, max_depth, current_depth + 1))
                  else:
                      # 对于文件，不递归，但添加到当前层级
                      if current_depth > 0: # 只在子目录中添加文件
                          toc.append(f"{indent}- [{item}](#{anchor})")
              return toc

          # 生成新的导航内容
          new_toc_lines = generate_toc()
          new_toc_content = '\n'.join(new_toc_lines)

          # 读取原始 README 内容
          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read()

          # 手动查找导航部分的开始和结束位置
          start_marker = "## 📂 目录导航\n\n"
          end_marker = "\n---\n"

          start_pos = content.find(start_marker)
          if start_pos == -1:
              print("Error: Could not find the start marker '## 📂 目录导航\\n\\n' in README.md")
              exit(1)

          # 从 start_pos + len(start_marker) 开始查找结束标记
          search_start = start_pos + len(start_marker)
          end_pos = content.find(end_marker, search_start)
          if end_pos == -1:
              print("Error: Could not find the end marker '\\n---\\n' after the navigation start in README.md")
              exit(1)

          # 提取导航部分之后的内容（包括结束标记）
          after_nav_content = content[end_pos:]

          # 重组内容：开始部分 + 新导航 + 之后的内容
          updated_content = content[:start_pos + len(start_marker)] + new_toc_content + "\n" + after_nav_content

          # 写回 README.md
          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(updated_content)
          
          print("README.md navigation updated successfully.")
          EOF

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          if git diff --staged --quiet README.md; then
            echo "No changes to commit."
          else
            git commit -m "docs: auto-update README navigation [skip ci]"
            git push
            echo "README.md updated and pushed."
          fi
