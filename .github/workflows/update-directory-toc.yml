name: Update Directory TOC

on:
  push:
    paths:
      - '**/*'  # trigger on any file change
  workflow_dispatch:

jobs:
  update-toc:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the current repository (no token needed)
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: true
          fetch-depth: 1

      # 2️⃣ Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 3️⃣ Generate TOC + headers
      - name: Generate README TOC and headers
        run: python scripts/generate_directory_toc.py

      # 4️⃣ Commit and push updates
      - name: Commit and push changes
        run: |
          git add README.md
          git diff --cached --quiet || git commit -m "Update directory TOC and headers"
          git push
