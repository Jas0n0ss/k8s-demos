name: Update Directory TOC

on:
  push:
    branches:
      - main   # ✅ Only run on main branch
  workflow_dispatch:

jobs:
  update-toc:
    runs-on: ubuntu-latest

    steps:
      # ✅ Checkout repository using GITHUB_TOKEN
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}  # ✅ No PAT required
          persist-credentials: true
          fetch-depth: 1

      # ✅ Configure Git user
      - name: Configure Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # ✅ Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # ✅ Generate TOC
      - name: Generate README TOC and headers
        run: python scripts/generate_directory_toc.py

      # ✅ Commit and push changes only if README.md changed
      - name: Commit and push changes
        if: github.actor != 'github-actions[bot]' # ✅ Prevent infinite loop
        run: |
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "Update directory TOC and headers"
            git push origin HEAD:${GITHUB_REF}
          else
            echo "No changes detected in README.md"
