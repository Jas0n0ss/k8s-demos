name: Update Directory TOC

on:
  push:
    paths:
      - '**/*'
  workflow_dispatch:

jobs:
  update-toc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.PAT_TOKEN }}  # 用 PAT 替代默认 token

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Generate README TOC and headers
        run: python scripts/generate_directory_toc.py

      - name: Commit and push changes
        run: |
          git add README.md
          git diff --cached --quiet || git commit -m "Update directory TOC and headers"
          git push
