apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`grafana.k8s.io`)
      kind: Rule
      services:
        - name: prometheus-grafana   # Service 名
          port: 80              # 对应 ClusterIP port
